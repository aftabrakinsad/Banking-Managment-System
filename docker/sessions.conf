# One session cookie per portal, so e.g. a manager login can never satisfy an admin page's check.
<Directory /var/www/html/Admin>
    php_value session.name ADMINSESSID
</Directory>
<Directory /var/www/html/Manager>
    php_value session.name MANAGERSESSID
</Directory>
<Directory /var/www/html/Employee>
    php_value session.name EMPLOYEESESSID
</Directory>
<Directory /var/www/html/User>
    php_value session.name CUSTOMERSESSID
</Directory>
