; Match XAMPP defaults the app was written against: pages print HTML before
; calling session_start()/header(), which only works with output buffering on.
output_buffering = 4096
display_errors = Off
log_errors = On
error_log = /dev/stderr
session.cookie_httponly = 1
session.use_strict_mode = 1
upload_max_filesize = 5M
post_max_size = 8M
