# No directory listings, no server banner, no PHP execution inside upload folders,
# and no direct web access to the shared config folder.
ServerTokens Prod
ServerSignature Off
<Directory /var/www/html>
    Options -Indexes
</Directory>
<DirectoryMatch "^/var/www/html/(Admin|Manager|Employee|User)/uploads">
    php_admin_flag engine off
</DirectoryMatch>
<Directory /var/www/html/config>
    Require all denied
</Directory>
